# Unified Cargo workspace for the gwz crates. Its single Cargo.lock is the one source of truth that
# Cargo and Bazel (via crate_universe, see MODULE.bazel) resolve from, so they stay in lockstep.
# The members are gwz-managed member repos checked out here (see .gitignore); gwz-cli depends on
# gwz-core by path, so the workspace lock unifies them with a single resolved graph. gwz-core is
# no longer listed as a member: it is its own Cargo workspace (see the exclude below) and reaches
# this lock as gwz-cli's path dependency.
[workspace]
resolver = "2"
members = [
    "gwz-cli",
]
# taut-shape-rs is its own Cargo workspace (own workspace.package inheritance);
# exclude it so this outer workspace does not absorb its members. The
# [patch.crates-io] below builds this outer workspace against the sibling
# taut-shape-rs checkout in place of the crates.io release gwz-core now depends on.
# gwz-core is likewise its own Cargo workspace since LCM1.0c follow-up 2
# (workspace layout Option A, operator ruling 2026-09-05; dev-docs/
# GwzLocalCloneDesign.md §11 item 14): its members are the local clone family
# libraries under gwz-core/crates/, tested with `cargo test -p <name> --lib
# --locked` from gwz-core/ against gwz-core/Cargo.lock. Excluding it here keeps
# this outer workspace from absorbing those members; gwz-cli's path dependency
# on gwz-core still resolves through this workspace's own Cargo.lock.
exclude = [
    "taut-shape-rs",
    "gwz-core",
]

[patch.crates-io]
taut-shape = { path = "taut-shape-rs/crates/taut-shape" }
